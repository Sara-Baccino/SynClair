[project]
name = "synclair-structure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sara Baccino", email = "baccinosara.2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hdbscan>=0.8.44",
    "numpy>=2.5.2",
    "pacmap>=0.9.1",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "scikit-fuzzy>=0.5.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "shap>=0.49.1",
    "synclair-core",
    "umap-learn>=0.5.12",
]

[project.scripts]
synclair-structure = "synclair_structure:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
synclair-core = { workspace = true, editable = true }
