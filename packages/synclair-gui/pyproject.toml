[project]
name = "synclair-gui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sara Baccino", email = "baccinosara.2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "synclair-core",
    "synclair-structure",
    "uvicorn>=0.52.4",
    "pyjwt>=2.9",
]

[project.scripts]
synclair-gui = "synclair_gui:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
synclair-core = { workspace = true, editable = true }
synclair-structure = { workspace = true, editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]